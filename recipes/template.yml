# TerminalGen Recipe Template
# Copy this to a new file in recipes/ and edit to create a new sequence style.

label: "template_style"
num_frames: 100
lines_per_frame: 5
width: 1920
height: 1080
fps: 24

# Styling
font_size: 18
line_spacing: 2
bg_color: [0, 0, 0]
text_color: [0, 255, 0]

# Feature Toggles
show_scanlines: true
show_danger_banner: true
show_progress_bar: true
show_glitch: true
show_tui_overlay: true
show_shell_prompt: true

# TUI Settings
# options: "ncdu", "copy", "htop", "netstat", "schematic", "defrag"
tui_type: "ncdu"
tui_speed: 1.0

# Shell Prompt Settings
prompt_prefix: "root@node-01:~#"
prompt_command_speed: 0.2

# Progress Bar Settings
progress_label: "PROCESSING"
progress_speed: 0.005

# Glitch Settings
glitch_chance: 0.1
glitch_intensity: 20

# Probabilities
prob_hex_dump: 0.15
prob_danger: 0.08
prob_warning: 0.12
flash_intensity: 0.2
